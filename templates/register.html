{% extends "base.html" %}
{% block title %}Sign up | {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="card form-card" method="POST">
    <h1>Create your account</h1>
    <label for="name">Full name</label>
    <input id="name" name="name" required>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>
    <label for="phone">Phone number</label>
    <input id="phone" name="phone" placeholder="07XX XXX XXX">
    <label for="password">Password</label>
    <input id="password" type="password" name="password" minlength="8" required>
    <p class="muted" style="margin-top:6px">At least 8 characters.</p>
    <button class="btn" type="submit">Sign up</button>
    <p class="muted" style="margin-top:16px;text-align:center">Already have an account? <a class="tag" href="{{ url_for('login') }}">Log in</a></p>
  </form>
</div>
{% endblock %}
