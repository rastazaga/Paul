{% extends "base.html" %}
{% block title %}Log in | {{ site_name }}{% endblock %}
{% block content %}
<div class="wrap">
  <form class="card form-card" method="POST">
    <h1>Log in</h1>
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <button class="btn" type="submit">Log in</button>
    <p class="muted" style="margin-top:16px;text-align:center">New here? <a class="tag" href="{{ url_for('register', next=request.args.get('next')) }}">Create an account</a></p>
  </form>
</div>
{% endblock %}
